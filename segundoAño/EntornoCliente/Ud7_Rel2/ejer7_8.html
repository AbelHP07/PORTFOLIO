<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ejer7_8.html</title>
</head>
<body>

    <h2>Calculadora de la letra del NIF</h2>

    <label for="dni">Introduce el número de DNI:</label>
    <input type="text" id="dni" placeholder="Ej: 12345678">
    <button id="btnCalcular">Calcular letra</button>

    <br><br>

    <label for="listaLetras">Letra del NIF:</label>
    <select id="listaLetras">
        <option value="T">T</option>
        <option value="R">R</option>
        <option value="W">W</option>
        <option value="A">A</option>
        <option value="G">G</option>
        <option value="M">M</option>
        <option value="Y">Y</option>
        <option value="F">F</option>
        <option value="P">P</option>
        <option value="D">D</option>
        <option value="X">X</option>
        <option value="B">B</option>
        <option value="N">N</option>
        <option value="J">J</option>
        <option value="Z">Z</option>
        <option value="S">S</option>
        <option value="Q">Q</option>
        <option value="V">V</option>
        <option value="H">H</option>
        <option value="L">L</option>
        <option value="C">C</option>
        <option value="K">K</option>
        <option value="E">E</option>
    </select>

<script>
    const letras = "TRWAGMYFPDXBNJZSQVHLCKE";

    const inputDni = document.getElementById("dni");
    const btnCalcular = document.getElementById("btnCalcular");
    const listaLetras = document.getElementById("listaLetras");

    btnCalcular.addEventListener("click", function() {
        let numeroDni = parseInt(inputDni.value);

        if (isNaN(numeroDni) || numeroDni <= 0) {
            alert("Por favor, introduce un número de DNI válido.");
            return;
        }

        let resto = numeroDni % 23;

        let letraCalculada = letras.charAt(resto);

        listaLetras.value = letraCalculada;
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ejer7_12.html</title>
    <script src="ejer7_12.js"></script>
</head>
<body>

    <script>
        let cliente1 = new Cliente("Diego", 1200);

        document.write("<h3>Estado Inicial:</h3>");
        document.write("Nombre: " + cliente1.nombre + "<br>");
        document.write("Saldo: " + cliente1.saldo + "<br><hr>");

        cliente1.depositar(120);

        document.write("<h3>Después de depositar 120:</h3>");
        document.write("Nombre: " + cliente1.nombre + "<br>");
        document.write("Saldo: " + cliente1.saldo + "<br><hr>");

        let extraccionExitosa = cliente1.extraer(1000);

        document.write("<h3>Después de extraer 1000:</h3>");
        document.write("Nombre: " + cliente1.nombre + "<br>");
        document.write("Saldo: " + cliente1.saldo + "<br>");
        if (extraccionExitosa) {
            document.write("Estado de la operación: Extracción realizada correctamente.<br>");
        } else {
            document.write("Estado de la operación: Error (saldo insuficiente).<br>");
        }
    </script>

</body>
</html>

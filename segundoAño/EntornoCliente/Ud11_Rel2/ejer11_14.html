<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer11_13.html</title>
    <style>
        .contenedor_principal{
            position: relative;
            box-sizing: border-box;
            height: fit-content;
            border: 1px solid gray;
            padding: 10px;
            padding-top: 15px;
        }
        .titulo_contenedor{
            position: absolute;
            top: -30px;
            left: 20px;
            padding: 5px;
            background-color: white;
        }
        td{
            width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Se puede usar un campo fieldset y usando un campo legend con el texto
     para el texto arriba en medio del borde -->

    <h1>Ejercicio. Tabla de multiplicar con InnerHTML</h1>
    <p>Usando <em>document.getElementById("").innerHTML</em> muestra en una capa la tabla de multiplicar introducido en el <em>&lt;input&gt;</em> de un formulario.</p>

    <div class="contenedor_principal" id="contenedor_principal">
        <p class="titulo_contenedor">Tabla de multiplicar</p><br>
        <label for="numero">Número:</label><br><input type="number" id="numero">
        <button type="button">multiplica</button>
    </div>
    <div id="resultado"><p>La tabla de multiplicar</p></div>
    <script>
        document.querySelector('#contenedor_principal button').addEventListener('click', () => {
            let numero = document.getElementById('numero').value;
            if(!numero || isNaN(numero) || numero == ''){
                return;
            }else{
                numero = parseInt(numero);
                let html = '<p><strong>Tabla de multiplicar del'+numero+'</strong></p><table>';

                for(let i = 1;i<=10;i++){
                    html += '<tr><td>'+numero+' x '+i+' =</td><td>'+numero*i+'</td></tr>';
                }

                html += '</table>';

                document.getElementById('resultado').innerHTML = html;
            }
        });
    </script>
</body>
</html>

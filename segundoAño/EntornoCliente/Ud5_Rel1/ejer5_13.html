<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer5_13.html</title>
</head>
<body>

<script>
    let suma = 0;

    for (let i = 1; i <= 10; i++) {
        let numero = parseInt(prompt("Introduce un número:"));

        while (isNaN(numero)) {
            numero = parseInt(prompt("Introduce un número:"));
        }

        if (numero < 0) {
            continue;
        }

        suma = suma + numero;

        document.write(`Número ${i}: ${numero}<br><br>`);
    }

    document.write("La suma es: " + suma);
    document.write("<p>Los números no escritos no aparecen porque son negativos y no se suman.</p>");
</script>

</body>
</html>

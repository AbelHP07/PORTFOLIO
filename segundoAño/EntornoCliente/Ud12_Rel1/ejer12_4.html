<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer12_4.html</title>
    <style>
        body{
            background-color: #323232;
            color: white;
        }
        div{
            height: 80px;
            width: 80px;
            border: 2px solid white;
            cursor: pointer;
        }
        div:first-of-type{
            background-color: lightgray;
        }
        div:nth-of-type(2){
            background-color: #323232;
        }
        div:last-of-type{
            background-color: gray;
        }
    </style>
</head>
<body>
    <p>Da click a un recuadro para cambiar el fondo de la página</p>
    <div></div>
    <div></div>
    <div></div>
    <p id="resultado"></p>

    <script>
        let grupoDiv = document.querySelectorAll('div');

        grupoDiv[0].addEventListener('click', () => {
            document.body.style.backgroundColor = 'lightgray';
        });

        grupoDiv[1].addEventListener('click', () => {
            document.body.style.backgroundColor = '#323232';
        });

        grupoDiv[2].addEventListener('click', () => {
            document.body.style.backgroundColor = 'gray';
        });
    </script>
</body>
</html>

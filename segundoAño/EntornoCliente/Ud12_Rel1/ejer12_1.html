<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer12_1.html</title>
</head>
<body>
    <h1>Página de inicio de Bach</h1>
    <p><strong>Johann Sebastian Bach fue un compositor prolífico. Entre sus obras se incluyen:</strong></p>
    <ul>
        <li>Las Variaciones Goldberg</li>
        <li>Los Conciertos de Brandemburgo</li>
        <li>El Oratorio de Navidad</li>
    </ul>

    <script>
        document.body.style.backgroundColor = "lightgreen";

        // para los párrafos
        let parrafos = document.querySelectorAll('p');
        parrafos.forEach(parrafo => parrafo.style.color = "green");

        // para los elementos de las listas
        let listas = document.querySelectorAll('li');
        listas.forEach(li => li.style.color = "green");

        // para los títulos
        let titulos = document.querySelectorAll('h1');
        titulos.forEach(h1 => h1.style.color = "green");
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer6_6.html</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .resaltado{
            font-weight: bold;
            font-style: oblique
        }
        table{
            border: 3px groove lightgray;
        }
        tr, td{
            text-align: center;
            width: fit-content;
            border: 3px groove lightgray;
        }
        .titulo{
            font-size: 20px;
            font-weight: bold;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <script>
        let importe = Number(prompt("Introduzca un importe"));

        let unidades = [5000, 2000, 1000, 500, 200, 100, 50, 25, 10, 5, 1];

        document.write(`<table>
                <tr>
                    <td class="titulo">DESGLOSES DE LA CANTIDAD: ${importe}</td>
                <tr>
            </table>`);

        document.write(`<table>`);

        for(let i = 0; i < unidades.length; i++){
            let cantidad = Math.floor(importe / unidades[i]);
            importe = importe % unidades[i];

            if(cantidad > 0){
                document.write(`<tr><td><span class='resaltado'>Unidades de ${unidades[i]} : ${cantidad}</span></td></tr>`);
            }else{
                document.write(`<tr><td><span>Unidades de ${unidades[i]} : ${cantidad}</span></td></tr>`);
            }
        }

        document.write(`</table>`);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer6_7.html</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .fondo{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <script>
        let numero = prompt("Introduzca un número entero positivo");

        while(isNaN(numero) || numero < 0){
            numero = prompt("Ese no vale, introduzca un número entero positivo");
        }

        let invertido = numero.split("").reverse().join("");

        document.write("<table border='1'>");
        document.write("<tr><th class='fondo'>EL NÚMERO INTRODUCIDO ES: " + numero + "</th></tr>");
        document.write("<tr><th><em>EL NÚMERO AL REVÉS ES: " + invertido + "</em></th></tr>");
        document.write("</table>");
    </script>
</body>
</html>

            document.write(`<p>${numero}*1= ${mult7}</p>\n`);
                const mult8 = numero * 9;
            document.write(`<p>${numero}*1= ${mult8}</p>\n`);
                const mult9 = numero * 10;
            document.write(`<p>${numero}*1= ${mult9}</p>\n`);
        }
    </script>

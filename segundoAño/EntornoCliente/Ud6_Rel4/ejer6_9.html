<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer6_9.html</title>
</head>
<body>
    <script>
        Array.prototype.eliminar = function(cadena){
            for(let i = this.length -1;i >= 0;i--){
                if(this[i].toLowerCase() == cadena.toLowerCase()){
                    this.splice(i,1);
                }
            }
        }

        let array = new Array('One','One','Two','Four','Three','One','Four')

        let cadenaABuscar = prompt('Introduzca una cadena para buscar:');

        while(cadenaABuscar === null || cadenaABuscar.trim() === "" || !isNaN(cadenaABuscar)){
            cadenaABuscar = prompt('Introduzca una cadena de caracteres:');
        }

        document.write('Los valores del array inicial son: '+array+'<br>');

        array.eliminar(cadenaABuscar);

        document.write('Los valores del array una vez buscado la cadena '+cadenaABuscar+' son: '+array);
    </script>
</body>
</html>

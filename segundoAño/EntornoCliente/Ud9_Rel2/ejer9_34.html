<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer9_34.html</title>
</head>
<body>
    <script>
        var email = prompt("Introduce una dirección de correo electrónico:", "usuario@servidor.com");
        var patron = /^([a-zA-Z0-9_]+)@([a-zA-Z0-9]+)\.([a-zA-Z]{2,3})$/;

        if (patron.test(email)) {
            document.write("El correo " + email + " es válido.");
        } else {
            document.write("El correo no es válido. Debe tener el formato: nombre_usuario@servidor.dominio");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer9_21.html</title>
</head>
<body>
    <table>
        <tr>
            <!-- Con this, nos referimos al elemento en el que está la función (en este caso la celda)-->
            <td onmouseover="pintar(this, 'red')" onmouseout="pintar(this, 'white')">Rojo</td>
            <td onmouseover="pintar(this, 'green')" onmouseout="pintar(this, 'white')">Verde</td>
            <td onmouseover="pintar(this, 'blue')" onmouseout="pintar(this, 'white')">Azul</td>
        </tr>
    </table>

    <script>
        function pintar(celda, color) {
            celda.style.backgroundColor = color;
        }
    </script>
</body>
</html>

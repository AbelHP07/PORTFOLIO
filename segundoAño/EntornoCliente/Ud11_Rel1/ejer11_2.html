<!DOCTYPE html>
<html lang="es">
<head>

</head>
<body>
    <h2>document.getElementById</h2>
    <br>
    <textarea id="miTextarea" style="height: 300px; width: 250px;"></textarea>
    <button id="miBoton">Contenido del TextArea</button>

    <script>
        document.getElementById("miBoton").onclick = function() {
            var texto = document.getElementById("miTextarea").value;
            alert(texto);
        };
    </script>
</body>

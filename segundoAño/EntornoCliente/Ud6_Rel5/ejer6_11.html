<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer6_11.html</title>
</head>
<body>
    <script>
        const estudiantes = [
            { nombre: "Ana", edad: 20, puntaje: 85 },
            { nombre: "Luis", edad: 22, puntaje: 92 },
            { nombre: "Carlos", edad: 19, puntaje: 78 },
            { nombre: "Sofía", edad: 21, puntaje: 95 },
            { nombre: "Miguel", edad: 20, puntaje: 70 }
        ]

        const estudiantesMayor80 = estudiantes.filter(estudiante => estudiante.puntaje > 80);

        console.log('Estudiantes con puntaje > 80: '+estudiantesMayor80);

        const estudiantesOrdenados = estudiantes.sort((a,b) => b.puntaje - a.puntaje);

        console.log('Estudiantes ordenados por puntaje: '+estudiantesOrdenados);

        const puntajeTotal = estudiantes.reduce((promedio,estudiante) => promedio += estudiante.puntaje, 0);

        const puntajePromedio = puntajeTotal/estudiantes.length;

        console.log('Promedio de puntajes: '+puntajePromedio);

        const nombreEstudiantes = estudiantes.map(estudiante => estudiante.nombre);

        console.log('Nombres de los estudiantes: '+nombreEstudiantes);
    </script>
</body>
</html>

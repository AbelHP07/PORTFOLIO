<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer4_5.html</title>
    <style>
        p{
            margin: 0;
        }
    </style>
</head>
<body>
    <script>
        for(i=1;i<=50;i++){
            document.write(`<p>`);
            for(o=0;o<i;o++){
                document.write(`${i}`);
            }
            document.write(`</p>`);
        }
    </script>
</body>
</html>

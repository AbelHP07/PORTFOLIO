<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer4_6.html</title>
    <style>
        p{
            margin: 0;
        }
    </style>
</head>
<body>
    <script>
        let num = "1";
        for(i=2;i<=51;i++){
            document.write(`<p>`);
            document.write(`${num}`);
            document.write(`</p>`);
            num = num+i;
        }
    </script>
</body>
</html>

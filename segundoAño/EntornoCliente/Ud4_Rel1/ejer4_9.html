<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer4_9.html</title>
    <style>
        p{
            font-size: 30px;
            margin: 0;
        }
    </style>
</head>
<body>

<script>
    let n = parseInt(prompt("Introduce un número entero:"));
    let factorial = 1;

    for (let i = n; i >= 1; i--) {
        factorial = factorial * i;
    }

    document.write(`<p>El factorial de ${n} es ${factorial}</p>`);
</script>

</body>
</html>
